name: Scheduled research

on:
  schedule:
    - cron: "0 6 * * 0"
  workflow_dispatch:

concurrency:
  group: ledgerwise-research
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-research.txt
      - run: npm ci
      - run: python -m pip install -r requirements-research.txt
      - run: npm run db:migrate
      - run: npm run research
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          GROQ_MIN_REQUEST_INTERVAL_MS: 30000
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          RESEARCH_TRIGGER: schedule
          RESEARCH_MAX_COMPANIES: 20
          RESEARCH_MAX_PAGES: 3
          RESEARCH_MAX_SCRAPY_PAGES: 8
          RESEARCH_SCRAPY_ENABLED: 1
          RESEARCH_MAX_FIRECRAWL_CREDITS: 200
