name: Verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-research.txt
      - run: npm ci
      - run: python -m pip install -r requirements-research.txt
      - run: python -m unittest discover -s scripts -p "test_*.py"
      - run: npm run db:migrate
      - run: npm run check
      - run: npm run benchmark:smoke
