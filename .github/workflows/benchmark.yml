name: Agent benchmark

on:
  workflow_dispatch:
    inputs:
      shard:
        description: Free-tier benchmark shard
        required: true
        default: 1/2
        type: choice
        options:
          - 1/2
          - 2/2
  schedule:
    - cron: "0 7 * * 1"
    - cron: "0 7 * * 2"

concurrency:
  group: ledgerwise-benchmark
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run benchmark
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_PROJECT: ledgerwise-evaluation
          LANGSMITH_TRACING: "true"
          BENCHMARK_SHARD: ${{ github.event_name == 'workflow_dispatch' && inputs.shard || (github.event.schedule == '0 7 * * 1' && '1/2' || '2/2') }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-report
          path: benchmark-results/latest.json
          retention-days: 14
